name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: Favazmubarak
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/github-snake.svg dist/github-snake-dark.svg
          git stash
          git fetch origin output 2>/dev/null || true
          git checkout --orphan output 2>/dev/null || git checkout output
          git checkout stash -- dist/github-snake.svg dist/github-snake-dark.svg
          git add dist/github-snake.svg dist/github-snake-dark.svg
          git commit -m "chore: update snake animation" --allow-empty
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Favazmubarak/Favazmubarak.git" output
